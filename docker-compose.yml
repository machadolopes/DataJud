x-app-hosts: &app-hosts
  extra_hosts:
    # Reach published host ports when container-to-container bridge traffic is blocked
    # (nested Docker). On a normal daemon this still works because ports are published.
    - "postgres:host-gateway"
    - "minio:host-gateway"
    - "mailpit:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parecer
      POSTGRES_PASSWORD: parecer
      POSTGRES_DB: parecer
    ports:
      - "5432:5432"
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parecer -d parecer"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - .data/minio:/data
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio-init:
    <<: *app-hosts
    image: ghcr.io/coollabsio/minio:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/parecer
        mc anonymous set none local/parecer
        exit 0

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  worker-ingest:
    <<: *app-hosts
    build:
      context: ./services/worker
    command: ["python", "-m", "worker.main", "--queue", "ingest"]
    environment:
      DATABASE_URL: postgresql://parecer:parecer@postgres:5432/parecer
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: parecer
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      LLM_MODE: mock
      EMAIL_PROVIDER: mailpit
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      WORKER_ID: ingest-1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-analysis:
    <<: *app-hosts
    build:
      context: ./services/worker
    command: ["python", "-m", "worker.main", "--queue", "analysis"]
    environment:
      DATABASE_URL: postgresql://parecer:parecer@postgres:5432/parecer
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: parecer
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      LLM_MODE: mock
      EMAIL_PROVIDER: mailpit
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      WORKER_ID: analysis-1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
