[project]
name = "parecer-worker"
version = "0.1.0"
description = "Ingest and analysis worker for Parecer Literário"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
